<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hero Client</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">

    <!-- Embedded CSS for Independence -->
    <style>
        /* Hero Client - Gold & Black Premium Design */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #FFD700;
            /* Gold */
            --primary-glow: rgba(255, 215, 0, 0.5);
            --secondary: #B8860B;
            /* Dark Goldenrod */
            --bg-dark: #050505;
            /* Deep Black */
            --card-bg: rgba(20, 20, 20, 0.8);
            --glass-border: rgba(255, 215, 0, 0.15);
            --text: #ffffff;
            --text-dim: #d4d4d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Animated Deep Space Background --- */
        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.3;
            animation: blobFloat 25s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.3) 0%, transparent 70%);
            animation-delay: -5s;
        }

        .blob-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40vw;
            height: 40vh;
            background: radial-gradient(circle, rgba(218, 165, 32, 0.2) 0%, transparent 70%);
            animation-delay: -10s;
        }

        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Stars */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- Navigation --- */
        .nav-container {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 1100px;
        }

        .nav-capsule {
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .btn-nav {
            background: var(--primary);
            color: #000;
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--primary-glow);
            background: #fff;
        }

        /* --- Hero --- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 6rem;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease backwards;
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: black;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px var(--primary-glow);
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 50px var(--primary-glow);
            filter: brightness(1.2);
        }

        .form-footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-dim);
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .nav-capsule {
                padding: 0.8rem 1.5rem;
            }

            .nav-container {
                top: 1rem;
                width: 95%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>

    <div class="bg-fixed">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="particles"></div>

    <!-- Capsule Nav -->
    <div class="nav-container">
        <nav class="nav-capsule">
            <a href="./" class="nav-logo">
                <i class="fa-solid fa-bolt"></i> HERO
            </a>
            <div class="nav-links">
                <!-- Links could go here -->
            </div>
            <a href="login.html" class="btn-nav">Login</a>
        </nav>
    </div>

    <!-- Login Form -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="rememberMe"
                            style="width: 16px; height: 16px; accent-color: var(--primary);">
                        <label for="rememberMe"
                            style="color: var(--text-dim); font-size: 0.9rem; cursor: pointer;">Remember Me</label>
                    </div>
                    <a href="https://discord.gg/5nsFmXWFJE" target="_blank"
                        style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">Forgot
                        Password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div id="message" style="margin-top: 1rem; text-align: center; min-height: 20px;"></div>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('hero_username') || sessionStorage.getItem('hero_username')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('message');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;

            // Loading State
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;
            msg.textContent = '';

            try {
                // PHP Endpoint
                const response = await fetch('login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    msg.style.color = '#4ade80';
                    msg.textContent = 'Login successful! Redirecting...';

                    // Save data from server
                    const storage = remember ? localStorage : sessionStorage;

                    if (data.username) storage.setItem('hero_username', data.username);
                    if (data.plan) storage.setItem('hero_plan', data.plan);
                    if (data.expiry) storage.setItem('hero_expiry', data.expiry);

                    storage.setItem('hero_logged_in', 'true');

                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    throw new Error(data.error || data.message || 'Invalid credentials');
                }
            } catch (error) {
                console.error('Login Error:', error);

                if (error instanceof SyntaxError) {
                    msg.style.color = '#ef4444';
                    msg.textContent = 'Server response was invalid.';
                } else {
                    msg.style.color = '#ef4444';
                    msg.textContent = error.message || 'Login failed. Please check your network.';
                }

                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
